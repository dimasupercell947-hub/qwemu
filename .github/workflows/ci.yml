name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 checks and installers
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install pinned Tauri CLI
        run: npm install --no-package-lock

      - name: Verify Tauri CLI version
        run: npm run tauri -- --version

      - name: Frontend syntax, unit and smoke tests
        run: npm run check

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Build Windows installers
        run: npm run tauri -- build --config src-tauri/tauri.conf.json

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: QWEMU-MUSIC-Windows-1.5.0
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
