name: Desktop Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and publish Windows installers
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Verify tag and all project versions
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($tag -ne "v$version") { throw "Tag $tag does not match app version v$version" }
          npm run check:version

      - name: Install pinned Tauri CLI
        run: npm install --no-package-lock

      - name: Verify Tauri CLI
        run: npm run tauri -- --version

      - name: Full test suite
        run: npm run check

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Build Windows NSIS EXE and MSI
        run: npm run tauri -- build --config src-tauri/tauri.conf.json

      - name: Verify installer outputs
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          if (-not $exe) { throw "NSIS EXE installer was not created." }
          if (-not $msi) { throw "MSI installer was not created." }
          Get-FileHash $exe.FullName -Algorithm SHA256
          Get-FileHash $msi.FullName -Algorithm SHA256

      - name: Publish GitHub Release with installers
        uses: softprops/action-gh-release@v2
        with:
          name: QWEMU MUSIC Desktop ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          fail_on_unmatched_files: true

      - name: Refresh public update manifest
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.GITHUB_REF_NAME || context.ref.split('/').pop();
            if (!tag) throw new Error('Missing release tag.');
            const version = tag.replace(/^v/i, '');
            const path = 'public/version.json';
            const manifest = {
              version,
              tag,
              release_url: 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/releases/tag/' + tag,
              channel: 'stable',
              updated_at: new Date().toISOString()
            };
            let sha;
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'
              });
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'chore: publish update manifest ' + version,
              content: Buffer.from(JSON.stringify(manifest, null, 2) + '\n').toString('base64'),
              sha,
              branch: 'main'
            });
            core.info('Update manifest refreshed to ' + version);
