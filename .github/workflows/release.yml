name: Desktop Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installers
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Verify tag version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($tag -ne "v$version") { throw "Tag $tag does not match app version v$version" }

      - name: Install pinned Tauri CLI
        run: npm install --no-package-lock

      - name: Verify Tauri CLI version
        run: npm run tauri -- --version

      - name: Frontend checks
        run: npm run check

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Build NSIS and MSI installers
        run: npm run tauri -- build --config src-tauri/tauri.conf.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
