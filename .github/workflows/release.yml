name: Publish Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Build and publish Windows installers
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Verify release tag and version consistency
        shell: pwsh
        run: |
          node -e 'const fs=require("fs"); const tag=process.env.GITHUB_REF_NAME.replace(/^v/,""); const pkg=require("./package.json").version; const tauri=require("./src-tauri/tauri.conf.json").version; const cargo=fs.readFileSync("./src-tauri/Cargo.toml","utf8").match(/^version = "([^"]+)"/m)?.[1]; const html=fs.readFileSync("./public/index.html","utf8").match(/<meta name="app-version" content="([^"]+)"/)?.[1]; const versions=[pkg,tauri,cargo,html]; if(versions.some(v=>!v)||versions.some(v=>v!==tag)){console.error({tag,package:pkg,tauri,cargo,html});process.exit(1)}'

      - name: Install pinned Tauri CLI
        run: npm install --no-package-lock

      - name: Verify frontend, unit and smoke tests
        run: npm run check

      - name: Verify Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Build Windows EXE and MSI
        run: npm run tauri -- build --config src-tauri/tauri.conf.json

      - name: Publish GitHub Release with installers
        uses: softprops/action-gh-release@v2
        with:
          name: QWEMU MUSIC Desktop ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          fail_on_unmatched_files: true

      - name: Refresh public update manifest
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.GITHUB_REF_NAME || context.ref.split('/').pop();
            if (!tag) throw new Error('Release tag is missing from the GitHub Actions context.');
            const version = tag.replace(/^v/i, '');
            const path = 'public/version.json';
            const manifest = {
              version: version,
              tag: tag,
              release_url: 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/releases/tag/' + tag,
              channel: 'stable',
              updated_at: new Date().toISOString()
            };
            try {
              let sha;
              try {
                const current = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: path,
                  ref: 'main'
                });
                sha = current.data.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: path,
                message: 'chore: publish update manifest ' + version,
                content: Buffer.from(JSON.stringify(manifest, null, 2) + '\n').toString('base64'),
                sha: sha,
                branch: 'main'
              });
              core.info('Update manifest refreshed to ' + version);
            } catch (error) {
              core.warning('Release is published, but the main-branch update manifest could not be refreshed: ' + error.message);
            }
