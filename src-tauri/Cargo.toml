[package]
name = "qwemu-music-desktop"
version = "2.0.2"
description = "QWEMU MUSIC Desktop for Windows"
authors = ["QWEMU"]
edition = "2021"

[lib]
name = "qwemu_music_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.12.7" }
tauri-plugin-updater = "2"

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["rustls-tls", "stream"]

[dependencies.tokio]
version = "1"
features = ["fs", "io-util", "net"]
